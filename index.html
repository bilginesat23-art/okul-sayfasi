<style>
:root{--dark:#142743;--red:#c92d38;--bg:#f2f5f9;--green:#147b48;--orange:#9a690e}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:#25364b;font-family:Arial,sans-serif;line-height:1.6}
button,select,input{font:inherit}
button{cursor:pointer}
.container{max-width:1200px;margin:auto;padding:0 18px}
.top{background:var(--dark);color:white;padding:9px;font-size:12px}
.top .container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.lang button{background:transparent;border:1px solid #ffffff66;color:white;border-radius:5px;padding:5px 10px}
.lang button.active{background:var(--red);border-color:var(--red)}
header{background:white;padding:23px 0}
.brand{display:flex;align-items:center;gap:18px}
.brand img{width:80px;height:80px;object-fit:contain}
.brand h1{color:var(--dark);margin:0;font-size:25px}
.brand p{color:#69778b;margin:3px 0}
nav{background:var(--dark);position:sticky;top:0;z-index:20;display:flex;justify-content:center;flex-wrap:wrap}
nav a{color:white;text-decoration:none;padding:13px;font-size:13px;font-weight:bold}
nav a:hover{background:var(--red)}
.hero{background:linear-gradient(90deg,#142743ef,#14274388),url("https://www.aa.com.tr/uploads/userFiles/4f62407a-abf2-4464-9690-b6acbca575b5/07_2024%2F01_MAYIS%2F20240517_2_63892780_100961255.jpg") center/cover;color:white;padding:100px 0;position:relative}
.hero h2{font-size:clamp(30px,5vw,48px);max-width:700px;color:white}
.hero p{max-width:600px}
.hero-quote{text-align:right;max-width:500px!important;margin:45px 0 0 auto;font-size:16px;font-style:italic;font-weight:bold;text-shadow:0 2px 5px #000}
section{padding-top:60px;scroll-margin-top:85px}
h2,h3{color:var(--dark)}
.card{background:white;padding:25px;border-radius:13px;box-shadow:0 5px 24px #14274312;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}
.person{background:white;border:1px solid #dce3ed;padding:22px;border-radius:12px;text-align:left;color:var(--dark)}
.person:hover{border-color:var(--red)}
.person strong{display:block}
.person small{color:#68778d}
.avatar{width:52px;height:52px;background:#fae9eb;color:var(--red);border-radius:12px;display:grid;place-items:center;font-size:20px;font-weight:bold;margin-bottom:13px}
.director{border-left:6px solid var(--red);display:flex;align-items:center;gap:22px}
.director .avatar{width:80px;height:80px;border-radius:50%;background:var(--dark);color:white;margin:0}
.detail{background:white;padding:22px;border-left:5px solid var(--red);border-radius:10px;margin-top:15px}
.detail[hidden],.hidden{display:none!important}
.tag{display:inline-block;padding:6px 12px;border-radius:20px;background:#f0f3f8;margin:4px;font-size:13px}
.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin:20px 0}
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:13px;font-weight:bold}
select,input{padding:11px;border:1px solid #cbd5e1;border-radius:8px;background:white;max-width:100%}
.btn{border:0;border-radius:8px;padding:12px 20px;background:var(--red);color:white;font-weight:bold}
.btn.dark{background:var(--dark)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:690px;font-size:13px}
th,td{border:1px solid #dce3ed;padding:12px;text-align:left;vertical-align:top}
thead th{background:var(--dark);color:white}
tbody tr:nth-child(even){background:#f7f9fc}
.free{color:var(--green);font-weight:bold}
.busy{color:var(--red);font-weight:bold}
.unknown{color:var(--orange);font-weight:bold}
.note{background:#fff8e8;border-left:4px solid #e7b451;padding:13px;margin-top:16px;border-radius:6px;font-size:13px}
.summary{font-weight:bold;margin:15px 0}
.edit-table select,.edit-table input{width:100%}
footer{margin-top:65px;background:var(--dark);color:white;text-align:center;padding:35px}
footer a{color:white}
footer p{margin:7px 0}
@media(max-width:600px){
header h1{font-size:18px}
header img{width:60px;height:60px}
.card{padding:14px}
.hero{padding:65px 0}
nav a{padding:9px;font-size:11px}
.director{flex-direction:column;text-align:center}
.hero-quote{font-size:13px}
}
</style>
</head>

}).join("")

}).join("")

let selectedTeacher=null,selectedClass=null;
function showTeachers(){
const grid=document.getElementById("teacherGrid"),body=document.getElementById("subjectBody");
grid.replaceChildren();body.replaceChildren();
teachers.forEach(t=>{
grid.append(card(t.name,T("showSubjects"),()=>{selectedTeacher=t.name;renderTeacherDetail()}));
const tr=make("tr");tr.append(make("td",translateName(t.name)),make("td",t.subjects.map(translateSubject).join(", ")));body.append(tr)
});
renderTeacherDetail()
}
function renderTeacherDetail(){
const el=document.getElementById("teacherDetail");el.replaceChildren();
const t=teachers.find(x=>x.name===selectedTeacher);
if(!t){el.hidden=true;return}
el.hidden=false;el.append(make("h3",translateName(t.name)));
t.subjects.forEach(s=>el.append(make("span",translateSubject(s),"tag")))
}
function showClasses(){
const grid=document.getElementById("classGrid");grid.replaceChildren();
classGroups.forEach((g,i)=>{
const grade=currentLanguage==="tr"?g.grade.replace(" и "," ve "):g.grade;
grid.append(card(g.teacher,grade+" "+T("gradeWord")+" – "+g.students.length+" "+T("students"),()=>{selectedClass=i;renderClassDetail()}))
});renderClassDetail()
}
function renderClassDetail(){
const el=document.getElementById("classDetail");el.replaceChildren();
if(selectedClass===null){el.hidden=true;return}
const g=classGroups[selectedClass];el.hidden=false;
el.append(make("h3",translateName(g.teacher)+" – "+g.grade.replace(" и ",currentLanguage==="tr"?" ve ":" и ")));
const list=make("ol");g.students.forEach(s=>list.append(make("li",translateStudentName(s))));el.append(list)
}
function showClassSchedule(){
const grade=document.getElementById("grade").value,data=classSchedules[grade],table=document.getElementById("classScheduleTable");
table.replaceChildren();document.getElementById("scheduleTitle").textContent=grade+" – "+T("weekly");
const head=make("thead"),tr=make("tr");
[T("lessonNumber"),...Array.from({length:5},(_,d)=>dayName(d))].forEach(x=>tr.append(make("th",x)));head.append(tr);
const body=make("tbody");
for(let h=0;h<7;h++){const row=make("tr");row.append(make("th",String(h+1)));for(let d=0;d<5;d++)row.append(make("td",translateLesson(data[d][h])));body.append(row)}
table.append(head,body)
}
const STORAGE_KEY="mka_replacements_primary_2026_v2";
let program={};
function addPrimaryTeacherSchedules(){
const nuzi="Нузи Ризвановски",asan="Асан Мемедовски",bilgin="Билгин Есат",english="Англиски јазик",science="Природни науки",technical="Техничко образование и информатика";
for(let d=0;d<5;d++)for(let h=0;h<7;h++){
const third=classSchedules.III[d][h];
program[nuzi][d][h]=third&&third!==english?{status:"busy",lesson:"III – "+third}:{status:"free",lesson:""};
const fourth=classSchedules.IV[d][h],fifth=classSchedules.V[d][h],asanClasses=[];
if(fourth&&fourth!==english)asanClasses.push("IV");
if(fifth&&fifth!==english&&fifth!==science&&fifth!==technical)asanClasses.push("V");
program[asan][d][h]=asanClasses.length?{status:"busy",lesson:asanClasses.join("/")+" – "+(fourth&&fourth!==english?fourth:fifth)}:{status:"free",lesson:""};
if(fifth&&(fifth===science||fifth===technical))program[bilgin][d][h]={status:"busy",lesson:"V – "+fifth}
}
}
function createProgram(){
program={};
teacherNames.forEach(name=>{
program[name]=[];
for(let d=0;d<5;d++){
program[name][d]=[];
for(let h=0;h<7;h++){
const value=initialPrograms[name]?.[d]?.[h];
program[name][d][h]=value==="-"?{status:"free",lesson:""}:value&&value!=="?"?{status:"busy",lesson:value}:{status:"unknown",lesson:""}
}
}
});
addPrimaryTeacherSchedules()
}
function loadProgram(){
createProgram();
try{
const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");
teacherNames.forEach(name=>{for(let d=0;d<5;d++)for(let h=0;h<7;h++){
const slot=saved?.[name]?.[d]?.[h];
if(slot&&["free","busy","unknown"].includes(slot.status))program[name][d][h]={status:slot.status,lesson:String(slot.lesson||"")}
}})
}catch(e){console.error(e)}
}
function freeTeachers(day,hour,absent){
return teacherNames.filter(name=>name!==absent&&program[name][day][hour].status==="free")
}
function showReplacement(){
const absent=document.getElementById("absentTeacher").value,day=Number(document.getElementById("selectedDay").value),body=document.getElementById("resultBody");
body.replaceChildren();
document.getElementById("resultTitle").textContent=translateName(absent)+" – "+dayName(day);
let busy=0,free=0,unknown=0;
for(let h=0;h<7;h++){
const slot=program[absent][day][h],row=make("tr"),hourCell=make("td",(h+1)+". "+T("lesson")),lessonCell=make("td"),statusCell=make("td"),replacementCell=make("td");
if(slot.status==="busy"){
busy++;
lessonCell.textContent=slot.lesson?translateSubject(slot.lesson):T("notEntered");
statusCell.textContent=T("hasLesson");statusCell.className="busy";
const candidates=freeTeachers(day,h,absent);
replacementCell.textContent=candidates.length?candidates.map(x=>translateName(x)+" – "+T("canReplace")).join("; "):T("noCandidates");
replacementCell.className=candidates.length?"free":"unknown"
}else if(slot.status==="free"){
free++;lessonCell.textContent="—";statusCell.textContent=T("noLesson");statusCell.className="free";replacementCell.textContent=T("notNeeded")
}else{
unknown++;lessonCell.textContent="—";statusCell.textContent=T("unverified");statusCell.className="unknown";replacementCell.textContent=T("needsCheck")
}
row.append(hourCell,lessonCell,statusCell,replacementCell);body.append(row)
}
document.getElementById("summary").textContent=T("total")+": "+busy+" "+T("busyCount")+" | "+free+" "+T("freeCount")+" | "+unknown+" "+T("unknownCount")
}
function showEditor(){
const teacher=document.getElementById("editTeacher").value,day=Number(document.getElementById("editDay").value),body=document.getElementById("editBody");
body.replaceChildren();
for(let h=0;h<7;h++){
const slot=program[teacher][day][h],tr=make("tr"),hour=make("td",(h+1)+". "+T("lesson")),statusCell=make("td"),lessonCell=make("td"),select=make("select");
select.className="editStatus";
[["unknown",T("unknown")],["busy",T("busy")],["free",T("free")]].forEach(([v,t])=>addOption(select,v,t));
select.value=slot.status;
const input=make("input");
input.className="editLesson";input.placeholder=T("placeholder");input.value=translateSubject(slot.lesson);input.disabled=select.value!=="busy";
select.onchange=()=>{input.disabled=select.value!=="busy"};
statusCell.append(select);lessonCell.append(input);tr.append(hour,statusCell,lessonCell);body.append(tr)
}
}
function saveProgram(){
const teacher=document.getElementById("editTeacher").value,day=Number(document.getElementById("editDay").value),statuses=document.querySelectorAll(".editStatus"),lessons=document.querySelectorAll(".editLesson");
for(let h=0;h<7;h++)program[teacher][day][h]={status:statuses[h].value,lesson:statuses[h].value==="busy"?toMacedonianLesson(lessons[h].value.trim()):""};
try{
localStorage.setItem(STORAGE_KEY,JSON.stringify(program));
document.getElementById("saveMessage").textContent=T("saved");document.getElementById("saveMessage").className="free"
}catch(e){
document.getElementById("saveMessage").textContent=T("saveError");document.getElementById("saveMessage").className="busy"
}
showReplacement()
}
function resetProgram(){
if(!confirm(T("resetConfirm")))return;
try{localStorage.removeItem(STORAGE_KEY)}catch(e){}
createProgram();showEditor();showReplacement();
document.getElementById("saveMessage").textContent=T("resetDone");
document.getElementById("saveMessage").className="free"
}
function showDuty(){
const grid=document.getElementById("dutyGrid");grid.replaceChildren();
duty.forEach((names,d)=>{const c=make("div",undefined,"card");c.append(make("h3",dayName(d)));names.forEach(name=>c.append(make("p",translateName(name))));grid.append(c)})

function showHours(){

hours.forEach((time,h)=>{const c=make("div",undefined,"card");c.append(make("strong",(h+1)+". "+T("lesson").toUpperCase()),make("h3",time));grid.append(c)})

function setLanguage(lang){
if(!["mk","tr"].includes(lang))return;
currentLanguage=lang;
try{localStorage.setItem("mka_language",lang)}catch(e){}
renderLanguage()
}
function renderLanguage(){
document.documentElement.lang=currentLanguage;
document.getElementById("mkBtn").classList.toggle("active",currentLanguage==="mk");
document.getElementById("trBtn").classList.toggle("active",currentLanguage==="tr");
document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=T(el.dataset.t)});
document.title=T("school");
document.getElementById("topInfo").textContent=T("year")+" | "+T("prepared");
document.getElementById("schoolName").textContent=T("school");
document.getElementById("schoolLocation").textContent=T("location");
document.getElementById("aboutSchool").textContent=T("school")+" – "+T("location");
document.getElementById("directorName").textContent=translateName("Бенази Шхемовска");
document.getElementById("directorAvatar").textContent=currentLanguage==="tr"?"BŞ":"БШ";
document.getElementById("footerSchool").textContent=T("school");
document.getElementById("footerDirector").textContent=T("directorFooter");
document.getElementById("footerLocation").textContent=T("location");
document.getElementById("footerYear").textContent=T("year");
document.getElementById("footerPrepared").textContent=T("prepared");
document.getElementById("footerOpen").textContent=T("open");
["selectedDay","editDay"].forEach(id=>{
const select=document.getElementById(id),oldValue=select.value;select.replaceChildren();
for(let d=0;d<5;d++)addOption(select,String(d),dayName(d));
select.value=oldValue
});
["absentTeacher","editTeacher"].forEach(id=>{
const select=document.getElementById(id);
Array.from(select.options).forEach(option=>{option.textContent=translateName(option.value)})
});
document.getElementById("saveMessage").textContent="";
showTeachers();showClasses();showClassSchedule();showReplacement();showEditor();showDuty();showHours()
}
function init(){
loadProgram();
const grade=document.getElementById("grade");
Object.keys(classSchedules).forEach(g=>addOption(grade,g,g));
grade.onchange=showClassSchedule;
const absent=document.getElementById("absentTeacher"),editTeacher=document.getElementById("editTeacher");
teacherNames.forEach(name=>{addOption(absent,name,name);addOption(editTeacher,name,name)});
absent.value="Билгин Есат";editTeacher.value="Билгин Есат";
["selectedDay","editDay"].forEach(id=>{
const select=document.getElementById(id);
for(let d=0;d<5;d++)addOption(select,String(d),daysMK[d])
});
absent.onchange=showReplacement;
document.getElementById("selectedDay").onchange=showReplacement;
document.getElementById("checkBtn").onclick=showReplacement;
editTeacher.onchange=showEditor;
document.getElementById("editDay").onchange=showEditor;
document.getElementById("saveBtn").onclick=saveProgram;
document.getElementById("resetBtn").onclick=resetProgram;
renderLanguage()
}
init();
